<title>Smart City – 3D Blueprint Model</title>
<style>
:root{--s1:#8fd0ff;--s2:#eaf7ff;--fg:#17242e;--card:rgba(255,255,255,.94);--ac:#1565c0;--on:#fff}

:root[data-theme="dark"]{--s1:#0b1d33;--s2:#27455f;--fg:#e8f1f7;--card:rgba(24,38,50,.94);--ac:#64b5f6;--on:#10202c}
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(var(--s1),var(--s2));color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.card{background:var(--card);border-radius:12px;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
#top{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px))}
#top b{font-size:16px}#top small{display:block;opacity:.8}
#bar{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:6px}
#dock{position:fixed;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
#panel{max-height:46vh;overflow-y:auto}#panel[hidden],#info[hidden]{display:none}
#panel ul{margin:6px 0 0;padding-left:18px}#panel li{margin:2px 0}
#panel label{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:4px}
#len{width:84px;padding:6px 8px;font:600 15px system-ui,sans-serif;border:1px solid var(--ac);border-radius:8px;background:transparent;color:var(--fg)}
button{flex:1;padding:10px 4px;border:0;border-radius:9px;background:var(--ac);color:var(--on);font:600 13px system-ui,sans-serif}
#top{display:flex;align-items:center;justify-content:space-between;gap:10px}
#night,#drone{flex:none;padding:9px 12px;white-space:nowrap}
body.fly #dock{display:none}#dpad[hidden]{display:none}
#dpad{position:fixed;left:8px;right:8px;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;-webkit-user-select:none;user-select:none}
#dpad .pad{display:grid;gap:6px;pointer-events:auto}#dpad .a{grid-template-columns:repeat(3,54px)}#dpad .b{grid-template-columns:54px}
#dpad button{padding:14px 0;font-size:18px;touch-action:none;opacity:.9}
#dpad [data-k=KeyW]{grid-column:2;grid-row:1}#dpad [data-k=KeyA]{grid-column:1;grid-row:2}#dpad [data-k=KeyS]{grid-column:2;grid-row:2}#dpad [data-k=KeyD]{grid-column:3;grid-row:2}
#sky{position:fixed;inset:0;background:linear-gradient(#01040c,#0a1c33 62%,#17314f);opacity:0;transition:opacity 1.4s linear;pointer-events:none}
body.night #sky{opacity:1}
body.night{--card:rgba(11,20,33,.92);--fg:#e8eff7;--ac:#ffb43c;--on:#1d1300}
body.embedded-background{background:transparent!important}
body.embedded-background #sky{display:none}
body.embedded-background #top,body.embedded-background #dock,body.embedded-background #bar,body.embedded-background #dpad{display:none!important}
.card,button{transition:background-color .6s,color .6s}
#cutp{max-height:46vh;overflow-y:auto}#cutp[hidden]{display:none}
#cutp .g{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:6px;margin:6px 0}
#cutp label{display:flex;align-items:center;gap:8px;font-weight:600}#cutp input[type=range]{flex:1}
button.on{box-shadow:inset 0 0 0 3px var(--on)}#bar button{padding:10px 2px;font-size:12px}

$('night').onclick=()=>setNight(!document.body.classList.contains('night'));
$('len').onchange=()=>{const v=Math.min(300,Math.max(40,+$('len').value||110));$('len').value=v;setS(v)};
$('len').oninput=()=>{const v=+$('len').value;if(v>=40&&v<=300)setS(v)};

/* tap a part for its size; the base board length scales every size */
const info=$('info'),ray=new T.Raycaster(),f1=v=>Math.round(v*10)/10;let hb=null;
const fmt=d=>d[2]*s<.25?f1(d[0]*s)+' × '+f1(d[1]*s)+' cm (flat)':f1(d[0]*s)+' × '+f1(d[1]*s)+' × '+f1(d[2]*s)+' cm';
function clearHi(){if(hb){S.remove(hb);hb=null}info.hidden=true}
function tap(e){ray.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),cam);
const h=CUT.on?pickCut():ray.intersectObjects(W.children,true).find(q=>q.object.isMesh);clearHi();if(!h)return;
let o=h.object;
if(o.isInstancedMesh){const i=h.instanceId,k=trees[i][2],c=i%2;info.innerHTML='<b>Tree</b><br>'+f1((c?1.6:1.7)*k*s)+' × '+f1((c?1.6:1.7)*k*s)+' × '+f1((c?3.3:2.55)*k*s)+' cm';info.hidden=false;return}
while(o&&!(o.userData&&o.userData.k))o=o.parent;if(!o)return;
const r=REG[o.userData.k];info.innerHTML='<b>'+r.n+'</b><br>'+fmt(r.dim)+'<br><small>length × width × height</small>';info.hidden=false;
if(CUT.on)return;bb.makeEmpty();r.o.forEach(q=>bb.expandByObject(q));hb=new T.Box3Helper(bb.clone(),0xffeb3b);hb.material.depthTest=false;hb.renderOrder=10;S.add(hb)}
function fill(){$('bs').textContent='Base board: '+f1(110*s)+' × '+f1(60*s)+' cm (default 110 × 60 cm). Every building, road and tree scales evenly.';
const m=new Map();Object.values(REG).forEach(r=>{const k=r.n+'|'+fmt(r.dim),e=m.get(k)||{n:r.n,t:fmt(r.dim),c:0};e.c++;m.set(k,e)});
const ks=trees.map(t=>t[2]),a=Math.min(...ks),b=Math.max(...ks);
$('plist').innerHTML=[...m.values()].map(e=>'<li>'+e.n+(e.c>1?' ×'+e.c:'')+': '+e.t+'</li>').join('')+'<li>Trees ×'+trees.length+': '+f1(1.6*a*s)+' to '+f1(1.7*b*s)+' wide, '+f1(2.55*a*s)+' to '+f1(3.3*b*s)+' high</li>'}
function setS(L){s=L/110;W.scale.setScalar(s);Object.assign(sun.shadow.camera,{left:-85*s,right:85*s,top:65*s,bottom:-65*s,near:10,far:300*s});sun.shadow.camera.updateProjectionMatrix();sun.position.set(40*s,90*s,50*s);R=R0*s;clearHi();fill()}
fill();

/* ===== cut / section tool ===== */
ren.localClippingEnabled=true;
const CP=new T.Plane(),CPA=[CP],CU={on:{value:0},col:{value:new T.Color(0xff8a3d)}},CM=new Set(),disc=[],
CUT={on:false,a:{x:0,z:0},b:{x:0,z:0},n:new T.Vector3(1,0,0),gap:8,view:0},DRAW={on:false,a:null,b:null,h:null,s:false},
nop=function(){},
patch=sh=>{sh.uniforms.uCutOn=CU.on;sh.uniforms.uCutCol=CU.col;sh.fragmentShader=sh.fragmentShader.replace('#include <common>','uniform float uCutOn;uniform vec3 uCutCol;\n#include <common>').replace('#include <dithering_fragment>','#include <dithering_fragment>\nif(uCutOn>.5&&!gl_FrontFacing)gl_FragColor=vec4(uCutCol,1.);')};
W.traverse(o=>{if(o.isMesh&&o.geometry.type=='CircleGeometry')disc.push(o);else if(o.isMesh||o.isPoints)[].concat(o.material).forEach(m=>CM.add(m))});
function mats(on){CM.forEach(m=>{if(m.userData.s0===undefined)m.userData.s0=m.side;m.clippingPlanes=on?CPA:null;m.clipShadows=on;
if((m.isMeshLambertMaterial||m.isMeshBasicMaterial)&&m.userData.s0===T.FrontSide&&!m.transparent){m.side=on?T.DoubleSide:T.FrontSide;m.shadowSide=on?T.BackSide:null;m.onBeforeCompile=on?patch:nop}
m.needsUpdate=true});CU.on.value=on?1:0;disc.forEach(d=>d.receiveShadow=!on)}
/* overlay: cut line, knife plane, A/B markers, half badges */
const CG=new T.Group(),bm=(c,o=1)=>new T.MeshBasicMaterial({color:c,transparent:o<1,opacity:o,depthTest:false,side:T.DoubleSide}),
rib=new T.Mesh(new T.PlaneGeometry(1,1).rotateX(-Math.PI/2),bm(0xffeb3b)),
kn=new T.Mesh(new T.PlaneGeometry(1,1),Object.assign(bm(0x40c4ff,.16),{depthTest:true,depthWrite:false})),
mA=new T.Mesh(new T.SphereGeometry(1,16,12),bm(0xff6d00)),mB=new T.Mesh(new T.SphereGeometry(1,16,12),bm(0x2979ff)),
bd=[1,2].map(i=>{const q=new T.Sprite(new T.SpriteMaterial({map:cv2(64,64,c=>{c.fillStyle=i==1?'#ff6d00':'#2979ff';c.beginPath();c.arc(32,32,29,0,7);c.fill();c.fillStyle='#fff';c.font='bold 38px system-ui';c.textAlign='center';c.fillText(i,32,45)}),depthTest:false}));q.scale.set(5,5,1);q.renderOrder=9;return q});
rib.renderOrder=mA.renderOrder=mB.renderOrder=8;kn.renderOrder=7;CG.add(rib,kn,mA,mB,...bd);CG.visible=false;S.add(CG);
function span(a,ux,uz){let t0=-1e4,t1=1e4;[[a.x,ux,56],[a.z,uz,31]].forEach(([p,d,h])=>{if(Math.abs(d)<1e-6)return;let u=(-h-p)/d,v=(h-p)/d;if(u>v){const w=u;u=v;v=w}t0=Math.max(t0,u);t1=Math.min(t1,v)});return[t0,t1]}
function ov(){const d=DRAW.on,a=d?DRAW.a:(CUT.on&&CUT.a),b=d?(DRAW.b||DRAW.h):CUT.b;CG.visible=!!a;if(!a)return;CG.scale.setScalar(s);
mA.position.set(a.x,.8,a.z);mA.scale.setScalar(1.1);mB.visible=!!b;kn.visible=bd[0].visible=bd[1].visible=CUT.on&&!d;if(!b)return;
mB.position.set(b.x,.8,b.z);mB.scale.setScalar(1.1);
const dx=b.x-a.x,dz=b.z-a.z,L=Math.hypot(dx,dz)||1,ux=dx/L,uz=dz/L;let t0=0,t1=L;if(CUT.on&&!d)[t0,t1]=span(a,ux,uz);
const len=t1-t0,mx=a.x+ux*(t0+t1)/2,mz=a.z+uz*(t0+t1)/2,an=-Math.atan2(dz,dx),o=9+(CUT.view?0:CUT.gap/2);
rib.position.set(mx,.25,mz);rib.rotation.y=an;rib.scale.set(len,1,.7);kn.position.set(mx,8,mz);kn.rotation.y=an;kn.scale.set(len,20,1);
bd.forEach((q,i)=>q.position.set(mx+CUT.n.x*(i?-o:o),4,mz+CUT.n.z*(i?-o:o)))}
/* placing each half: shift along the cut normal and clip everything on the other side */
function place(h){const g=CUT.view?0:CUT.gap*s/2,k=h==1?1:-1;W.position.set(CUT.n.x*k*g,0,CUT.n.z*k*g);W.updateMatrixWorld(true);
CP.setFromNormalAndCoplanarPoint(new T.Vector3(CUT.n.x*k,0,CUT.n.z*k),new T.Vector3(CUT.a.x*s+W.position.x,0,CUT.a.z*s+W.position.z))}
const side=l=>(CUT.n.x*(l.position.x-CUT.a.x)+CUT.n.z*(l.position.z-CUT.a.z))>=0?1:2;
function frame(){ov();if(!CUT.on){ren.render(S,cam);return}
const lv=labs.map(l=>l.visible);ren.autoClear=false;ren.clear();
(CUT.view?[CUT.view]:[1,2]).forEach(h=>{place(h);labs.forEach((l,i)=>l.visible=lv[i]&&side(l)==h);ren.render(S,cam)});
W.position.set(0,0,0);W.updateMatrixWorld(true);labs.forEach((l,i)=>l.visible=lv[i]);
W.visible=false;ren.shadowMap.autoUpdate=false;ren.render(S,cam);ren.shadowMap.autoUpdate=true;W.visible=true;ren.autoClear=true}
function pickCut(){let best=null;(CUT.view?[CUT.view]:[1,2]).forEach(h=>{place(h);const q=ray.intersectObjects(W.children,true).find(q=>q.object.isMesh&&CP.distanceToPoint(q.point)>=-1e-4);if(q&&(!best||q.distance<best.distance))best=q});W.position.set(0,0,0);W.updateMatrixWorld(true);return best}
/* UI: presets, free line (drag A→B, or tap A then tap B), gap, which half to show */
const cutp=$('cutp'),msg=t=>$('cmsg').textContent=t,gv=()=>$('cgv').textContent=f1(CUT.gap*s)+' cm',
setCut=on=>{if(CUT.on!==on){CUT.on=on;mats(on)}clearHi()};
function setLine(a,b){CUT.a=a;CUT.b=b;const dx=b.x-a.x,dz=b.z-a.z,L=Math.hypot(dx,dz);CUT.n.set(-dz/L,0,dx/L);setCut(true);$('cdraw').classList.remove('on');msg('Model divided along the line. Badges 1 and 2 mark the two halves.')}
function endDraw(){DRAW.on=false;DRAW.a=DRAW.b=DRAW.h=null;$('cdraw').classList.remove('on')}
function pickXZ(e){ray.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),cam);
const h=ray.intersectObjects(W.children,true).find(q=>q.object.isMesh);let p=h&&h.point;if(!p){p=new T.Vector3();if(!ray.ray.intersectPlane(new T.Plane(new T.Vector3(0,1,0),0),p))return null}
return{x:Math.max(-55,Math.min(55,p.x/s)),z:Math.max(-30,Math.min(30,p.z/s))}}
function dDown(e){const p=pickXZ(e);if(!p)return;DRAW.h=p;DRAW.s=false;if(!DRAW.a||DRAW.b){DRAW.a=p;DRAW.b=null;DRAW.s=true}}
function dMove(e){const p=pickXZ(e);if(p)DRAW.h=p}
function dUp(e){const p=pickXZ(e)||DRAW.h;if(!p||!DRAW.a)return;if(DRAW.s&&moved<8){msg('Point A set. Now tap point B.');return}
if(Math.hypot(p.x-DRAW.a.x,p.z-DRAW.a.z)<2){msg('Points are too close. Pick point B farther away.');return}
const a=DRAW.a;endDraw();setLine(a,p)}
cv.addEventListener('pointermove',e=>{if(DRAW.on&&DRAW.a&&!P.size){const p=pickXZ(e);if(p)DRAW.h=p}});
$('cut').onclick=()=>{const o=cutp.hidden;cutp.hidden=!o;$('cut').classList.toggle('on',o);if(o){$('panel').hidden=true;gv()}else endDraw()};
$('sizes').addEventListener('click',()=>{if(!$('panel').hidden){cutp.hidden=true;$('cut').classList.remove('on');endDraw()}});
$('cmid').onclick=()=>{endDraw();setLine({x:0,z:-30},{x:0,z:30})};
$('cmid2').onclick=()=>{endDraw();setLine({x:-55,z:0},{x:55,z:0})};
$('cdraw').onclick=()=>{if(DRAW.on){endDraw();msg('Drawing cancelled.');return}setCut(false);DRAW.on=true;DRAW.a=DRAW.b=DRAW.h=null;$('cdraw').classList.add('on');msg('Drag from point A to point B on the model (or tap A, then tap B).')};
$('cclr').onclick=()=>{endDraw();setCut(false);msg('Cut cleared.')};
$('cgap').oninput=()=>{CUT.gap=+$('cgap').value;gv()};
document.querySelectorAll('#cv button').forEach(b=>b.onclick=()=>{CUT.view=+b.dataset.v;document.querySelectorAll('#cv button').forEach(x=>x.classList.toggle('on',x==b));clearHi()});
$('night').addEventListener('click',()=>CU.col.value.set(document.body.classList.contains('night')?0x9a5222:0xff8a3d));

/* ===== futuristic touches: glowing tower crowns, maglev monorail, light haze ===== */
G(null);S.fog=new T.Fog(0xcfe6fb,260,1100);
BL.filter(b=>b[4]>=11).forEach(([x,z,w,d,h])=>{put(new T.Mesh(new T.TorusGeometry(Math.min(w,d)*.45,.07,6,28).rotateX(Math.PI/2),MB(0x4fe8ff)),x,h+.45,z,W);put(new T.Mesh(new T.CylinderGeometry(.04,.1,3.2,6),MB(0xbfefff)),x,h+2.1,z,W)});
B(3,4.2,-13.2,66,.4,1.1,0xdfe6ea,W);for(let x=-27;x<=33;x+=12)B(x,.3,-13.2,.7,3.9,.7,0xaab4bc,W);
put(new T.Mesh(new T.BoxGeometry(66,.06,.35),MB(0x4fe8ff)),3,4.65,-13.2,W);
const train=new T.Group();W.add(train);train.position.set(3,4.6,-13.2);
[-3.2,0,3.2].forEach(x=>{put(new T.Mesh(new T.BoxGeometry(3,.9,1.1),M(0xf5f8fa)),x,.45,0,train);put(new T.Mesh(new T.BoxGeometry(2.8,.35,1.12),M(0x1e3a5c)),x,.6,0,train)});

/* ===== drone view: WASD / arrow keys (or the on-screen pad), drag to look ===== */
const DR={p:new T.Vector3(0,26,52),yaw:0,pitch:-.45,roll:0,k:{}};
addEventListener('keydown',e=>{if(flyOn&&/^(Arrow|Key[WASDQE]|Space|Shift)/.test(e.code)){DR.k[e.code]=true;e.preventDefault()}});
addEventListener('keyup',e=>{DR.k[e.code]=false});addEventListener('blur',()=>{DR.k={}});
document.querySelectorAll('#dpad button').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{DR.k[k]=true;e.preventDefault()});['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,()=>{DR.k[k]=false}))});
$('drone').onclick=()=>{flyOn=!flyOn;DR.k={};document.body.classList.toggle('fly',flyOn);$('dpad').hidden=!flyOn;$('drone').textContent=flyOn?'🗺 Orbit':'🚁 Drone';
$('hint').textContent=flyOn?'WASD / arrows fly · Q/E down/up · Shift fast · drag to look':'Drag to rotate · pinch to zoom · tap any part for its size';
if(flyOn){DR.p.set(0,26*s,52*s);DR.yaw=0;DR.pitch=-.45}fit()};
function fly(dt){const k=DR.k,v=16*s*(k.ShiftLeft||k.ShiftRight?2.4:1)*dt,f=(k.KeyW||k.ArrowUp?1:0)-(k.KeyS||k.ArrowDown?1:0),r=(k.KeyD||k.ArrowRight?1:0)-(k.KeyA||k.ArrowLeft?1:0),u=(k.KeyE||k.Space?1:0)-(k.KeyQ?1:0),sn=Math.sin(DR.yaw),cs=Math.cos(DR.yaw);
DR.p.x=Math.max(-75*s,Math.min(75*s,DR.p.x+(-sn*f+cs*r)*v));DR.p.z=Math.max(-55*s,Math.min(55*s,DR.p.z+(-cs*f-sn*r)*v));DR.p.y=Math.max(2.5*s,Math.min(95*s,DR.p.y+u*v));
DR.roll+=(-r*.09-DR.roll)*Math.min(1,dt*6);cam.position.copy(DR.p);cam.rotation.set(DR.pitch,DR.yaw,DR.roll,'YXZ')}

let t0=performance.now();
(function loop(){const t=performance.now()/1000,dt=Math.min(.05,(performance.now()-t0)/1000);t0=performance.now();
rotors.forEach(([r,i])=>r.rotation.z=t*(1.2+i%3*.3));wheels.forEach((w,i)=>w.rotation.z=t*(i?-1:1));
smoke.forEach(([m,o,x,zz,y0])=>{const p=(t*.22+o)%1;m.position.set(x+p*1.2,y0+p*6,zz);m.scale.setScalar(.7+p*1.1);m.material.opacity=.7*(1-p)});
cars.forEach(c=>{const [a,b,e,d]=RD[c.ri],L=Math.hypot(e-a,d-b);c.u=(c.u+c.v*dt/L)%1;const u=c.sd>0?c.u:1-c.u,dx=(e-a)/L,dz=(d-b)/L;
c.g.position.set(a+(e-a)*u-dz*.4*c.sd,.1,b+(d-b)*u+dx*.4*c.sd);c.g.rotation.y=-Math.atan2(dz,dx)+(c.sd>0?0:Math.PI)});
boats.forEach((g,i)=>g.position.y=.1+Math.sin(t*1.2+i)*.05);
if(spin)th+=.004;
train.position.x=3+Math.sin(t*.22)*24;const nn=document.body.classList.contains('night');S.fog.color.setHex(nn?0x07101d:0xcfe6fb);S.fog.near=(nn?700:260)*s;S.fog.far=(nn?3600:1100)*s;
if(flyOn){fly(dt);cam.near=.3}else{cam.position.set(R*Math.sin(ph)*Math.sin(th),3*s+R*Math.cos(ph),R*Math.sin(ph)*Math.cos(th));cam.lookAt(0,3*s,0);cam.near=Math.max(.5,R*.03)}cam.updateProjectionMatrix();
NIGHT.tick(t,dt);frame();requestAnimationFrame(loop)})();
</script></body></html>
